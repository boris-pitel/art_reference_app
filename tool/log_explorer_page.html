<style>
  :root {
    --ground: #14131a; --panel: #1c1b24; --edge: #2e2c3a;
    --ink: #e8e6f0; --dim: #918da6; --accent: #8b7ff0;
    --bad: #ff6b6b; --warn: #ffb454; --good: #5fd18c;
    --mono: ui-monospace, "Cascadia Mono", "Consolas", monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--ground); color: var(--ink);
    font: 14px/1.5 system-ui, "Segoe UI", sans-serif;
  }
  header {
    display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap;
    padding: 14px 20px; border-bottom: 1px solid var(--edge);
  }
  h1 { font-size: 15px; margin: 0; font-weight: 600; letter-spacing: .01em; }
  .count { color: var(--dim); font-size: 13px; }
  .controls { padding: 14px 20px; border-bottom: 1px solid var(--edge); }
  .row { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; flex-wrap: wrap; }
  label.field { color: var(--dim); font-size: 12px; text-transform: uppercase; letter-spacing: .06em; min-width: 72px; }
  select, input, button {
    background: var(--panel); color: var(--ink); border: 1px solid var(--edge);
    border-radius: 6px; padding: 6px 9px; font: inherit; font-size: 13px;
  }
  button { cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); color: #14131a; border-color: var(--accent); font-weight: 600; }
  button.link { background: none; border: none; color: var(--accent); padding: 4px 6px; }
  .cols { display: flex; flex-wrap: wrap; gap: 4px 14px; }
  .cols label { display: inline-flex; align-items: center; gap: 5px; font-size: 13px; color: var(--dim); cursor: pointer; }
  .cols input:checked + span { color: var(--ink); }
  .wrap { overflow: auto; max-height: calc(100vh - 260px); }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th {
    position: sticky; top: 0; background: var(--panel); text-align: left;
    padding: 8px 10px; border-bottom: 1px solid var(--edge); white-space: nowrap;
    font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--dim);
  }
  td { padding: 6px 10px; border-bottom: 1px solid #232130; vertical-align: top; }
  tr:hover td { background: #1a1923; }
  td.num { text-align: right; font-variant-numeric: tabular-nums; font-family: var(--mono); }
  td.mono { font-family: var(--mono); font-size: 12px; }
  .pill { padding: 1px 8px; border-radius: 999px; font-size: 11px; font-weight: 600; }
  .s-succeeded { background: rgba(95,209,140,.15); color: var(--good); }
  .s-failed { background: rgba(255,107,107,.15); color: var(--bad); }
  .s-cancelled { background: rgba(145,141,166,.15); color: var(--dim); }
  .s-started { background: rgba(255,180,84,.15); color: var(--warn); }
  tr.unfinished td { background: rgba(255,107,107,.07); }
  tr.unfinished td:first-child { border-left: 3px solid var(--bad); }
  .flag { color: var(--bad); font-size: 11px; font-weight: 600; white-space: nowrap; }
  .note { color: var(--dim); font-size: 11px; white-space: nowrap; }
  .err { color: var(--bad); font-family: var(--mono); font-size: 12px; max-width: 40ch; }
  .truncate { max-width: 30ch; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: block; }
  .empty { padding: 40px 20px; color: var(--dim); text-align: center; }
</style>

<header>
  <h1>Activity log</h1>
  <span class="count" id="count"></span>
  <span class="count" id="unfinishedCount"></span>
  <span style="flex:1"></span>
  <button class="link" id="csv">Export CSV</button>
</header>

<div class="controls">
  <div class="row">
    <label class="field">Columns</label>
    <div class="cols" id="cols"></div>
  </div>

  <div class="row">
    <label class="field">Filters</label>
    <div style="flex:1" id="filters"></div>
  </div>

  <div class="row">
    <label class="field"></label>
    <button id="addFilter">+ Filter</button>
    <span style="flex:1"></span>
    <label class="field" style="min-width:auto">Limit</label>
    <input id="limit" type="number" value="500" style="width:88px">
    <button class="primary" id="run">Run</button>
  </div>
</div>

<div class="wrap"><table><thead><tr id="head"></tr></thead><tbody id="body"></tbody></table></div>
<div class="empty" id="empty">Run a query to see rows.</div>

<script>
const COLUMNS = ['created_at','user_email','operation','status','duration_ms','elapsed_ms',
                 'platform','app_version','target_type','target_id','parent_image_id',
                 'error_message','details'];
const DEFAULT = ['created_at','user_email','operation','status','duration_ms','platform','error_message'];
// elapsed_ms is derived by pairing, so it cannot be filtered on server-side.
const FILTERABLE = COLUMNS.filter(c => c !== 'elapsed_ms');
const OPS = [['eq','is'],['neq','is not'],['contains','contains'],['gt','after / >'],
             ['lt','before / <'],['empty','is empty'],['present','is not empty']];

let rows = [];

const el = id => document.getElementById(id);

COLUMNS.forEach(c => {
  const l = document.createElement('label');
  l.innerHTML = `<input type="checkbox" ${DEFAULT.includes(c)?'checked':''} value="${c}"><span>${c}</span>`;
  l.querySelector('input').addEventListener('change', render);
  el('cols').append(l);
});

function addFilter(column = 'status', op = 'eq', value = '') {
  const d = document.createElement('div');
  d.className = 'row filter';
  d.innerHTML = `
    <select class="c">${FILTERABLE.map(c=>`<option ${c===column?'selected':''}>${c}</option>`).join('')}</select>
    <select class="o">${OPS.map(([v,t])=>`<option value="${v}" ${v===op?'selected':''}>${t}</option>`).join('')}</select>
    <input class="v" value="${value}" placeholder="value" style="min-width:200px">
    <button class="link remove">remove</button>`;
  d.querySelector('.remove').onclick = () => d.remove();
  d.querySelector('.v').addEventListener('keydown', e => { if (e.key === 'Enter') run(); });
  el('filters').append(d);
}

el('addFilter').onclick = () => addFilter();
el('run').onclick = run;

function selectedColumns() {
  return [...el('cols').querySelectorAll('input:checked')].map(i => i.value);
}

async function run() {
  const params = new URLSearchParams();
  params.set('limit', el('limit').value || '500');

  // Its own counter, not the loop index: the server stops at the first gap,
  // so a skipped filter would silently drop every filter after it.
  let n = 0;

  [...document.querySelectorAll('.filter')].forEach(f => {
    const c = f.querySelector('.c').value;
    const o = f.querySelector('.o').value;
    const v = f.querySelector('.v').value.trim();

    // "is empty" and "is not empty" need no value; everything else does.
    if (!v && o !== 'empty' && o !== 'present') return;

    params.set(`f${n}c`, c);
    params.set(`f${n}o`, o);
    params.set(`f${n}v`, v);
    n++;
  });

  el('run').textContent = 'Running…';

  try {
    const res = await fetch(`/api/query?${params}`);
    const data = await res.json();
    if (data.error) throw new Error(data.error);
    rows = data;
    render();
  } catch (e) {
    el('empty').textContent = `Query failed: ${e.message}`;
    el('empty').style.display = 'block';
  } finally {
    el('run').textContent = 'Run';
  }
}

function cell(row, col) {
  const v = row[col];
  if (v === null || v === undefined || v === '') return '<td></td>';

  if (col === 'status') {
    // Two different things, deliberately styled differently: work that started
    // and never came back (a real stranded operation), versus an operation
    // that never records an end anywhere — an instrumentation gap, not a fault.
    let flag = '';
    if (row.unfinished) flag = ' <span class="flag">never finished</span>';
    else if (row.no_end_recorded) flag = ' <span class="note">no end logged</span>';
    return `<td><span class="pill s-${v}">${v}</span>${flag}</td>`;
  }
  if (col === 'created_at') return `<td class="mono">${v.slice(0,19).replace('T',' ')}</td>`;
  if (col === 'duration_ms' || col === 'elapsed_ms') {
    return `<td class="num">${v >= 1000 ? (v/1000).toFixed(1)+'s' : v+'ms'}</td>`;
  }
  if (col === 'error_message') return `<td class="err">${escape(v)}</td>`;
  if (col === 'details') {
    const t = JSON.stringify(v);
    return `<td class="mono" title="${escape(t)}"><span class="truncate">${escape(t)}</span></td>`;
  }
  if (col === 'target_id' || col === 'parent_image_id') {
    return `<td class="mono" title="${escape(v)}">${escape(String(v).slice(0,8))}</td>`;
  }
  return `<td>${escape(String(v))}</td>`;
}

function escape(s) {
  return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
}

function render() {
  const cols = selectedColumns();
  el('head').innerHTML = cols.map(c => `<th>${c}</th>`).join('');
  el('body').innerHTML = rows.map(r =>
    `<tr class="${r.unfinished ? 'unfinished' : ''}">${cols.map(c => cell(r, c)).join('')}</tr>`
  ).join('');

  const stranded = rows.filter(r => r.unfinished).length;
  el('count').textContent = `${rows.length} rows`;
  el('unfinishedCount').innerHTML = stranded
    ? `<span class="flag">${stranded} never finished</span>`
    : '';
  el('empty').style.display = rows.length ? 'none' : 'block';
  if (!rows.length) el('empty').textContent = 'No rows matched.';
}

el('csv').onclick = () => {
  const cols = selectedColumns();
  const csv = [cols.join(',')].concat(rows.map(r =>
    cols.map(c => `"${String(r[c] ?? '').replace(/"/g,'""')}"`).join(',')
  )).join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], {type:'text/csv'}));
  a.download = `activity-log-${new Date().toISOString().slice(0,19).replace(/:/g,'-')}.csv`;
  a.click();
};

addFilter('status', 'eq', 'failed');
run();
</script>
