<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A personal library for collecting and organizing art reference images.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Painter Reference">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Painter Reference</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    Bootstrap written out in full rather than using flutter_bootstrap.js, so
    the loader can be started without service worker settings.

    Every screen in this app needs the network, so caching it offline gains
    nothing, while a stale cache repeatedly made deployed fixes look broken
    during testing. Without serviceWorkerSettings the loader registers no
    worker, and a deploy takes effect on the next ordinary refresh.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script>
    // Visitors from earlier builds still have a worker installed, and it will
    // keep serving the old app until it is removed — so clear it out before
    // starting, along with the caches it filled.
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations()
        .then(function (registrations) {
          for (var i = 0; i < registrations.length; i++) {
            registrations[i].unregister();
          }
        })
        .catch(function () {});
    }

    if (window.caches && caches.keys) {
      caches.keys()
        .then(function (names) {
          for (var i = 0; i < names.length; i++) {
            caches.delete(names[i]);
          }
        })
        .catch(function () {});
    }
  </script>

  <script>
    {{flutter_js}}
    {{flutter_build_config}}

    _flutter.loader.load();
  </script>
</body>
</html>
